name: NBA Provider Diagnostics
on:
  push:
    branches: [dev/windows-research-lab]
    paths: ['.github/workflows/nba-provider-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run NBA provider diagnostics
        run: python tools/probe_sources.py --acknowledge-terms --sources NBA_STATS NBA_LIVE NBA_INJURY_REPORT --out probe_report.json
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-provider-probe-report
          path: probe_report.json
          if-no-files-found: warn
