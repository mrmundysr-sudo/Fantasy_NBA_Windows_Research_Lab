name: windows-build
on:
  push:
    branches: [dev/**]
  pull_request:
  workflow_dispatch:
    inputs:
      probe_sources:
        description: 'Run the live provider probe (makes a few small requests per source)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt pytest playwright
      - name: Unit and integration tests
        run: python -m pytest -q tests
      - name: UI smoke test (headless Chromium)
        shell: pwsh
        run: |
          python -m playwright install chromium
          python tools/ui_smoke.py; if ($LASTEXITCODE -ne 0) { Write-Host 'smoke failed once, retrying'; python tools/ui_smoke.py }
          exit $LASTEXITCODE
      - name: Build Windows app (PyInstaller)
        run: pyinstaller packaging/nbalab.spec --noconfirm
      - name: Packaged app self-test
        shell: pwsh
        run: |
          $out = & .\dist\NBALab\NBALab.exe --selftest --db "$env:RUNNER_TEMP\selftest.sqlite" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $msg = ($out -replace "`r","" -replace "%","%25" -replace "`n","%0A")
            if ($msg.Length -gt 3500) { $msg = $msg.Substring($msg.Length - 3500) }
            Write-Host "::error title=selftest exit $code::$msg"
            exit 1
          }
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path dist\NBALab -DestinationPath NBALab-windows-portable.zip
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # account artifact-storage quota can block this; it must not mask test/build results
        with:
          name: NBALab-windows-portable
          path: NBALab-windows-portable.zip
          retention-days: 14
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy pytest
      - run: python -m pytest -q tests
  provider-probe:
    # Manual only: makes live requests to NBA.com and vendors. GitHub-hosted runners are cloud IPs, which stats.nba.com is reported
    # to ignore (see docs/DATA_PROVIDER_EVALUATION.md), so a failure here does not prove the endpoint fails on a home connection.
    if: github.event_name == 'workflow_dispatch' && inputs.probe_sources
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - name: Probe NBA stats and live feeds
        run: python tools/probe_sources.py --acknowledge-terms --sources NBA_STATS NBA_LIVE --out probe_report.json --save-samples probe_samples
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: provider-probe
          path: |
            probe_report.json
            probe_samples

  diagnostics-exe:
    # Builds NBA-Source-Diagnostics.exe (one file, no installer, no admin) and attaches it to a PRIVATE GitHub release
    # (the repository is private, so only people with repository access can download it).
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pypdf playwright pytest numpy
      - name: Diagnostics tests and page test
        shell: pwsh
        run: |
          python -m pytest -q tests/test_diagnostics.py
          python -m playwright install chromium
          python tools/diag_ui_smoke.py
      - name: Build NBA-Source-Diagnostics.exe
        run: pyinstaller packaging/diag.spec --noconfirm
      - name: Packaged exe self-test (no network)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "diag-selftest.txt"
          $p = Start-Process -FilePath (Resolve-Path .\dist\NBA-Source-Diagnostics.exe).Path -ArgumentList "--selftest","--selftest-out",$out -Wait -PassThru
          $code = $p.ExitCode
          $exists = Test-Path $out
          $txt = if ($exists) { Get-Content $out -Raw } else { "(no output file written)" }
          Write-Host "exit=$code file=$exists"
          Write-Host $txt
          $msg = "exit=$code file=$exists " + ($txt -replace "`r","" -replace "%","%25" -replace "`n","%0A")
          if ($msg.Length -gt 3000) { $msg = $msg.Substring(0, 3000) }
          if ($code -ne 0 -or $txt -notmatch "SELFTEST OK") { Write-Host "::error title=diagnostics exe selftest::$msg"; exit 1 }
          Write-Host "::notice title=diagnostics exe selftest::$msg"
      - name: Publish to private release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "diagnostics-latest"
          $size = [math]::Round((Get-Item dist\NBA-Source-Diagnostics.exe).Length / 1MB, 1)
          $notes = "NBA Source Diagnostics ($size MB). Built from commit $env:GITHUB_SHA on $(Get-Date -Format u). Download NBA-Source-Diagnostics.exe, double-click, confirm terms, press Run Tests, then Export Report. Windows may show a SmartScreen notice because the file is not code-signed: choose More info, then Run anyway."
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --prerelease --target $env:GITHUB_SHA --title "NBA Source Diagnostics (latest dev build)" --notes $notes } else { gh release edit $tag --notes $notes }
          gh release upload $tag dist\NBA-Source-Diagnostics.exe --clobber
          Write-Host "::notice title=release::https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
