name: windows-build
on:
  push:
    branches: [dev/**]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt pytest playwright
      - name: Unit and integration tests
        run: python -m pytest -q tests
      - name: UI smoke test (headless Chromium)
        run: |
          python -m playwright install chromium
          python tools/ui_smoke.py
      - name: Build Windows app (PyInstaller)
        run: pyinstaller packaging/nbalab.spec --noconfirm
      - name: Packaged app self-test
        shell: pwsh
        run: |
          $out = & .\dist\NBALab\NBALab.exe --selftest --db "$env:RUNNER_TEMP\selftest.sqlite" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $msg = ($out -replace "`r","" -replace "%","%25" -replace "`n","%0A")
            if ($msg.Length -gt 3500) { $msg = $msg.Substring($msg.Length - 3500) }
            Write-Host "::error title=selftest exit $code::$msg"
            exit 1
          }
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path dist\NBALab -DestinationPath NBALab-windows-portable.zip
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # account artifact-storage quota can block this; it must not mask test/build results
        with:
          name: NBALab-windows-portable
          path: NBALab-windows-portable.zip
          retention-days: 14
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy pytest
      - run: python -m pytest -q tests
